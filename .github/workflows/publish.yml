name: Publish to npm

# Publishes the package to npm when a GitHub Release is published. The release
# is the trigger, so the pipeline is: bump version -> tag -> create release ->
# this workflow builds, tests, and publishes with provenance.
# Manual `workflow_dispatch` publishes whatever version is on the default branch.
#
# Auth is npm Trusted Publishing (OIDC) — no NPM_TOKEN. It requires:
#   - `id-token: write` (below), and
#   - a trusted publisher configured on npmjs.com for this repo + `publish.yml`,
#   - npm >= 11.5.1 (installed below; setup-node still ships npm 10.x).

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    name: Build, test & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package version matches the release tag
        if: github.event_name == 'release'
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          echo "package.json=$PKG  release tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error title=Version mismatch::package.json ($PKG) does not match the release tag ($TAG). Bump package.json before releasing."
            exit 1
          fi

      - name: Upgrade npm for OIDC trusted publishing
        # OIDC trusted publishing needs npm >= 11.5.1; setup-node ships npm 10.x.
        # Node 22 supports the current npm@latest.
        run: npm install -g npm@latest

      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
